language: scala
scala:
  - 2.12.1
jdk:
  - oraclejdk8

before_install:
  - sudo mkdir -p /usr/share/kotlin/bin
  - sudo mkdir -p /usr/share/kotlin/lib
  - sudo wget -nc -O /usr/share/kotlin/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.1.1/kotlin-compiler-1.1.1.zip
  - sudo unzip -j -n /usr/share/kotlin/kotlin.zip 'kotlinc/bin/*' -d /usr/share/kotlin/bin
  - sudo unzip -j -n /usr/share/kotlin/kotlin.zip 'kotlinc/lib/*' -d /usr/share/kotlin/lib

cache:
  directories:
    - /usr/share/kotlin
